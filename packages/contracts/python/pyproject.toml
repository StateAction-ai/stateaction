[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[project]
name = "stateaction-contracts"
version = "0.1.0"
description = "StateAction v1 API, task and artifact contract validators"
requires-python = "==3.12.*"
dependencies = ["jsonschema==4.26.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/stateaction_contracts"]

[tool.hatch.build.targets.wheel.force-include]
"../api" = "stateaction_contracts/_api"

[dependency-groups]
dev = ["mypy==1.19.1", "ruff==0.17.3"]

[tool.uv]
required-version = "==0.13.6"

[tool.mypy]
files = ["src/stateaction_contracts"]
strict = true

[[tool.mypy.overrides]]
module = ["jsonschema.*", "referencing.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
