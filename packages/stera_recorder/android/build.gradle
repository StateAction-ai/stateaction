group 'open.fpvlabs.stera.ar_recorder'
version '1.0'

buildscript {
    // Keep this in step with the AGP + Kotlin the host app pins — a mismatch
    // fails the build.
    ext.kotlin_version = '2.1.0'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.9.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace 'open.fpvlabs.stera.ar_recorder'
    compileSdk 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_11.toString()
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    testOptions {
        unitTests.includeAndroidResources = true
    }

    defaultConfig {
        // ARCore requires API 24.
        minSdk 24
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        if (project.hasProperty('sa57Qualification')) {
            testApplicationId 'open.fpvlabs.stera.upload.qualification'
            // Match the pinned Flutter app target for foreground start rules.
            targetSdk 36
        }
        consumerProguardFiles 'consumer-rules.pro'
    }
}

dependencies {
    implementation 'com.google.ar:core:1.44.0'
    // SA-57: foreground WorkManager fallback for API 33 (UIDT JobScheduler covers API 34+).
    implementation 'androidx.work:work-runtime:2.10.0'
    testImplementation 'junit:junit:4.13.2'
    // Real org.json for plain-JVM tests (the android.jar one is a stub).
    testImplementation 'org.json:json:20250517'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    testImplementation 'org.mockito:mockito-core:5.14.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'org.mockito:mockito-android:5.14.2'
}
