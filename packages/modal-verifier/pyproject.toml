[project]
name = "stateaction-modal-verifier"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["modal==1.6.4", "aiohttp==3.14.5", "stateaction-contracts"]

[build-system]
requires = ["hatchling==1.30.1"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["ruff==0.13.3"]

[tool.uv]
required-version = "==0.13.6"

[tool.uv.sources]
stateaction-contracts = { path = "../contracts/python" }
