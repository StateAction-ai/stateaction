name: PR policy
on:
  pull_request:
    types: [opened, reopened, synchronize, edited, ready_for_review]
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request to validate (dispatch on its head branch)
        required: true
        type: string
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: pr-policy-${{ github.event.number || inputs.pr_number }}
  cancel-in-progress: true
jobs:
  ticket:
    name: Ticket reference
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Validate one ticket and its original PR
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.number || inputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/automation/check_pr.py
