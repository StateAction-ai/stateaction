[project]
name = "stateaction-controller"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "httpx==0.28.1",
  "modal==1.6.4",
  "render-sdk==1.7.0",
  "stateaction-contracts",
  "stateaction-modal-verifier",
]

[build-system]
requires = ["hatchling==1.30.1"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest==8.4.2", "ruff==0.17.3"]

[tool.uv]
required-version = "==0.13.6"

[tool.uv.sources]
stateaction-contracts = { path = "../../packages/contracts/python" }
stateaction-modal-verifier = { path = "../../packages/modal-verifier" }

[tool.ruff]
extend = "../processing/pyproject.toml"
src = []
