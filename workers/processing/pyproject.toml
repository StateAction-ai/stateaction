[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[project]
name = "stateaction-processing"
version = "0.1.0"
description = "StateAction processing worker boundary and local interoperability adapter"
requires-python = "==3.12.*"
dependencies = []

[project.optional-dependencies]
cpu = [
  "rerun-sdk==0.41.0", "mediapipe==1.2.0", "av==19.0.2", "mcap==1.6.0",
  "mcap-protobuf-support==0.6.0", "mcap-ros2-support==0.6.0",
  "foxglove-schemas-protobuf==0.4.0",
]

[project.scripts]
stateaction-worker = "stateaction_processing.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/stateaction_processing"]

[dependency-groups]
dev = ["mypy==1.19.1"]

[tool.uv]
required-version = "==0.13.6"

[tool.mypy]
files = ["src/stateaction_processing/cli.py", "src/stateaction_processing/compat.py"]
strict = true
follow_imports = "skip"
