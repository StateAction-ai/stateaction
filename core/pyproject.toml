[project]
name = "stateaction-recipes"
version = "1.0.0"
requires-python = "==3.12.13"
dependencies = ["jsonschema==4.26.0", "referencing==0.37.0"]

[dependency-groups]
dev = ["mypy==1.19.1", "ruff==0.17.3"]

[tool.uv]
required-version = "==0.13.6"
package = false

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
mypy_path = "core"
