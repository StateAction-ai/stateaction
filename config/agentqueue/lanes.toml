# StateAction lane manifest for agentqueue (see docs/components/workstation-resource-guard.md).
# The guard prepends `state_dir` and `roots` (registered StateAction project roots) and passes a
# per-submit `--budget`; nothing here applies outside those roots. Command-name mapping is not
# used on purpose: a command without `--lane` runs in the Free class.
memory_budget = "12G"

# SA-135: several full gates run at once. `slots` is only a ceiling per project; the machine-wide
# memory reservation (the guard's `--budget`: aggregate cap - 4 GiB Free share - 6 GiB warm
# emulator, 14 GiB at the 24 GiB maximum cap, 6 GiB at the 12 GiB boot cap) decides how many
# 6 GiB tickets run, and the rest wait in FIFO order. At the maximum cap that is two gates; a
# third needs a 28 GiB cap and waits. Each gate keeps its own scope (`agent-lane-ci-<repo>[-s<n>]`),
# export/Nx state, port block, per-tree lock and shared-Postgres connection budget (SA-108).
# Includes the Android tooling the gate drives (flattened under one ticket).
[lanes.ci]
slots = 3
mem = "6G"
runtime = "90m"
timeout = "3h"

# Android/Flutter/Gradle build or unit-test jobs per project, admitted by memory like `ci`.
[lanes.android-build]
slots = 2
mem = "6G"
runtime = "60m"
timeout = "3h"

# One emulator test session machine-wide (the sole emulator rule; the guarded SDK launcher and
# the warm supervisor are unchanged).
[lanes.emulator]
slots = 1
mem = "6G"
runtime = "90m"
timeout = "3h"
