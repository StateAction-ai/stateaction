name: stateaction-local
services:
  postgres:
    image: postgres:17.9-alpine3.23@sha256:c7526c0f6c3f30260a563d7bcf8ad778effac59a44f8ffa86678c35418338609
    environment:
      POSTGRES_USER: stateaction
      POSTGRES_PASSWORD: stateaction-local-only
      POSTGRES_DB: stateaction
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stateaction -d stateaction"]
      interval: 2s
      timeout: 2s
      retries: 30
  storage:
    image: chrislusf/seaweedfs:4.51@sha256:f7a49e3f3972ebed5be2ed4befa4a0c68eb7bdddba6e692d42729ceb545134b8
    command:
      [
        "server",
        "-ip=127.0.0.1",
        "-ip.bind=0.0.0.0",
        "-dir=/data",
        "-volume.max=32",
        "-master.volumeSizeLimitMB=64",
        "-filer",
        "-s3",
        "-s3.port=9000",
        "-s3.config=/etc/seaweedfs/s3.json",
      ]
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - storage-data:/data
      - ./seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro
      - ./seaweedfs-master.toml:/etc/seaweedfs/master.toml:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'wget -qO- http://127.0.0.1:9333/dir/status | grep -q "\"Url\":\"127.0.0.1:8080\""',
        ]
      interval: 2s
      timeout: 2s
      retries: 30
volumes:
  postgres-data:
  storage-data:
