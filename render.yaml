# StateAction hosted topology. Validate with `render blueprints validate render.yaml`.
# Applying this file creates PAID resources; see docs/components/render-deployment.md for the
# exact order. Nothing here is deployed by CI or by the SA-14 change itself.
# Secrets use `sync: false` (prompted once at Blueprint creation); no secret value appears in this file. The production processor is the Modal CPU function (SA-42); its API credential lives only on the workflow service.
databases:
  - name: stateaction-db
    region: ohio
    plan: basic-256mb
    ipAllowList: [] # private network only; operators add a /32 temporarily for the owner migration
services:
  - type: web
    name: stateaction-web
    runtime: node
    region: ohio
    plan: starter
    rootDir: .
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false && pnpm --filter "@stateaction/web..." build
    startCommand: pnpm --filter @stateaction/server hosted:preflight && pnpm --filter @stateaction/web start
    healthCheckPath: /api/v1/live
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_VERSION
        value: 24.22.2
      - key: APP_ENV
        value: production
      # Restricted application role only. The owner connection string never reaches this
      # service: DATABASE_HOST/PORT/NAME come from Render, the password is chosen by the operator
      # (the same value is passed to the explicit owner migration, which creates the role).
      - key: APP_DB_PASSWORD
        sync: false
      - key: DATABASE_HOST
        fromDatabase:
          name: stateaction-db
          property: host
      - key: DATABASE_PORT
        fromDatabase:
          name: stateaction-db
          property: port
      - key: DATABASE_NAME
        fromDatabase:
          name: stateaction-db
          property: database
      # Private Cloudflare R2 bucket, backend-only credentials (never bundled into mobile/web).
      - key: S3_REGION
        value: auto
      - key: S3_ENDPOINT
        sync: false # https://<account>.r2.cloudflarestorage.com
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      # Recording admission (SA-19, web only). The processing profile revision pinned on
      # admitted jobs is an operator decision per environment (prompted, never defaulted);
      # h264_mcap_v1 is the only RGB profile the server code accepts.
      - key: PROCESSING_PROFILE_REVISION
        sync: false
      - key: SUPPORTED_RGB_PROFILES
        value: h264_mcap_v1
      # Job admission (SA-25, web only). The permanent input identity recorded on every
      # admitted job. Backend, code revision, worker image spec digest and config digest are
      # release inputs the operator supplies (prompted, never defaulted; preflight refuses to
      # start without them). The model digest is the accepted CPU model pin: MediaPipe Hand
      # Landmarker (full, float16, task bundle v1, Apache-2.0) as pinned by the SA-30/SA-61
      # hand_model.json manifest.
      - key: PROCESSING_EXECUTION_BACKEND
        sync: false # local | modal
      - key: PROCESSING_CODE_REVISION
        sync: false
      - key: PROCESSING_IMAGE_SPEC_SHA256
        sync: false
      - key: PROCESSING_CONFIG_SHA256
        sync: false
      - key: PROCESSING_MODEL_SHA256
        value: fbc2a30080c3c557093b5ddfc334698132eb341044ccee322ccf8bcf3607cde1
      # Dispatch authority (SA-27, web only). The API alone starts the process-recording
      # Render task (idempotency key job:{jobId}); the repair cron holds neither this key
      # nor any database or Modal credential. Unset = dispatch reported unavailable, nothing
      # starts. The slug is <workflow-slug>/process-recording.
      - key: RENDER_API_KEY
        sync: false
      - key: PROCESS_RECORDING_TASK_SLUG
        sync: false
      # Authentication (web only; SA-15 owns the implementation, not yet merged). One Better
      # Auth instance. BETTER_AUTH_URL is this service's public HTTPS origin (the onrender.com
      # or custom-domain URL, known only after creation). The secret is generated per
      # environment. AUTH_LOCAL_PASSWORD must never be set here: it is refused on Render.
      # Do NOT set BETTER_AUTH_TRUSTED_ORIGINS or BETTER_AUTH_SECRETS (unsupported overrides);
      # add AUTH_TRUSTED_ORIGINS only for extra exact HTTPS origins.
      - key: BETTER_AUTH_URL
        sync: false
      - key: BETTER_AUTH_SECRET
        generateValue: true
      # Real Google OAuth web client; the Google/account gate is still open.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
  - type: workflow
    name: stateaction-workflow
    runtime: node
    region: ohio
    repo: https://github.com/timothywangdev/stateaction
    branch: main
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false && pnpm --filter "@stateaction/jobs..." build
    startCommand: pnpm --filter @stateaction/jobs start
    autoDeployTrigger: "off"
    # Tasks never receive database or storage credentials (API-only boundary).
    envVars:
      - key: NODE_VERSION
        value: 24.22.2
      - key: APP_ENV
        value: production
      # SA-26 controller: API-only access with an operator-issued workflow credential
      # (scopes jobs:status, jobs:reconcile; max 24 h; issue-service-capability). No
      # database or storage credential.
      - key: STATEACTION_API_URL
        sync: false
      - key: CONTROLLER_CAPABILITY_TOKEN
        sync: false
      # SA-42: production runs the Modal executor only (`modal`); the local executor is refused
      # outside APP_ENV=local and loopback API origins are refused. The Modal API credential is
      # held by this controller service ALONE (never web, cron or the processing container).
      # Nothing here deploys or spawns Modal: the operator deploys workers/processing/modal_app.py
      # and enters the two secrets once (billable; see docs/components/modal-executor.md).
      - key: EXECUTION_BACKEND
        sync: false
      - key: MODAL_APP_NAME
        value: stateaction-processing
      - key: MODAL_FUNCTION_NAME
        value: process_recording
      - key: MODAL_TOKEN_ID
        sync: false
      - key: MODAL_TOKEN_SECRET
        sync: false
      # Controller journal (call identity before/after the single spawn). Task-local disk: a
      # controller on another instance adopts a known call from the API's recorded reference.
      - key: JOBS_STATE_DIR
        value: /tmp/stateaction-jobs
  # SA-27 minute repair pass: one bounded call to the API's repair endpoint, then exit.
  # Credentials: a repair-scoped API capability ONLY (scope jobs:repair, max 24 h, issued with
  # issue-service-capability --kind cron). No database, Render-start, Modal or storage secret.
  # Render runs at most one cron instance at a time; the schedule is UTC.
  - type: cron
    name: stateaction-repair
    runtime: node
    region: ohio
    plan: starter
    schedule: "* * * * *"
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false && pnpm --filter "@stateaction/jobs..." build
    startCommand: pnpm --filter @stateaction/jobs repair
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_VERSION
        value: 24.22.2
      - key: APP_ENV
        value: production
      - key: STATEACTION_API_URL
        sync: false # https origin of stateaction-web
      - key: REPAIR_CAPABILITY_TOKEN
        sync: false
